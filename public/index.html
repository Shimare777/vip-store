
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP STORE | Premium Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{padding:24px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.logo{font-size:27px;font-weight:bold;color:#d5ad55;letter-spacing:2px}
.cart{color:#d5ad55;font-weight:bold}
.hero{text-align:center;padding:85px 20px;background:linear-gradient(120deg,#191919,#292116)}
.hero h1{font-size:48px;margin:0 0 15px}
.hero h1 span{color:#d5ad55}
.hero p{color:#ccc;font-size:17px}
.hero a{display:inline-block;margin-top:20px;padding:14px 28px;background:#d5ad55;color:#111;text-decoration:none;font-weight:bold;border-radius:4px}
h2{text-align:center;color:#d5ad55;margin:45px 0 25px}
.products{padding:0 6% 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.product{background:#1c1c1c;border:1px solid #333;border-radius:10px;overflow:hidden;text-align:center;padding-bottom:20px}
.product img{width:100%;height:210px;object-fit:cover}
.product h3{margin:16px 8px 8px}
.price{color:#d5ad55;font-size:19px;font-weight:bold}
button{background:#d5ad55;border:0;padding:12px 20px;margin-top:10px;font-weight:bold;border-radius:4px;cursor:pointer}
footer{text-align:center;padding:30px;background:#080808;color:#aaa}
</style>
</head>
<body>
<header>
<div class="logo">VIP STORE</div>
<div class="cart">🛒 Basket: <span id="count">0</span></div>
</header>

<section class="hero">
<h1>WELCOME TO <span>VIP STORE</span></h1>
<p>Discover quality. Discover style. Shop VIP.</p>
<a href="#products">SHOP NOW</a>
</section>

<h2 id="products">OUR COLLECTION</h2>

<section class="products">
<div class="product">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=700" alt="Headphones">
<h3>Wireless Headphones</h3>
<p class="price">£49.99</p>
<button onclick="add()">ADD TO BASKET</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=700" alt="Watch">
<h3>Luxury Watch</h3>
<p class="price">£64.00</p>
<button onclick="add()">ADD TO BASKET</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=700" alt="Lamp">
<h3>Modern Table Lamp</h3>
<p class="price">£38.50</p>
<button onclick="add()">ADD TO BASKET</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=700" alt="Backpack">
<h3>Everyday Backpack</h3>
<p class="price">£42.00</p>
<button onclick="add()">ADD TO BASKET</button>
</div>
</section>

<footer>
<p>VIP STORE © 2026</p>
<p>Premium shopping, made simple.</p>
</footer>

<script>
let count=0;
function add(){
count++;
document.getElementById("count").textContent=count;
}
</script>
</body>
</html>
